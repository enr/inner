name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_VERSION: ${{ github.ref_name }}
        run: .sdlc/build

      - name: Package
        run: |
          binary="bin/inner"
          [ "${{ matrix.goos }}" = "windows" ] && mv "${binary}" "${binary}.exe" && binary="${binary}.exe"
          zip_name="inner-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          cd bin && zip "../${zip_name}" "$(basename ${binary})"
          echo "ZIP=${zip_name}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: inner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
