name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_VERSION: ${{ github.ref_name }}
        run: .sdlc/build

      - name: Package
        run: |
          zip_name="inner-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          cd bin && zip "../${zip_name}" inner
          echo "ZIP=${zip_name}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v6
        with:
          name: inner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
