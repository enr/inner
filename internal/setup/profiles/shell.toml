schema_version = "1"
name = "shell"
description = "Interactive bash shell in sandbox (no network)"

[sandbox]
network   = false
clipboard = false

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "/bin/bash"
args        = []
interactive = true
history     = [
  "git status",
  "git log --oneline -10",
  "ls -la",
]

[output]
summary         = false
log             = "~/.config/inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
