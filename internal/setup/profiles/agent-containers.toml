schema_version = "1"
name        = "agent-containers"
description = "Agent con supporto container via podman rootless"

[sandbox]
network = true
allow   = ["nested-user-ns", "podman-socket"]

# ${UID} is expanded at load time to the numeric UID of the current user.
# Requires `podman system service` running on the host before `inner run`.
[mounts]
"/run/user/${UID}/podman/podman.sock" = { dest = "/run/podman/podman.sock", mode = "rw" }
"~/.local/share/containers"           = { dest = "~/.local/share/containers", mode = "rw" }
"~/.config/containers"                = { dest = "~/.config/containers",      mode = "rw" }

[env]
clearenv = true
inherit  = ["ANTHROPIC_API_KEY", "TERM", "LANG"]
set      = { "DOCKER_HOST" = "unix:///run/podman/podman.sock" }

[noop]
block   = ["apt-get", "apt", "yum", "dnf", "brew"]
rewrite = { "docker" = "podman", "docker-compose" = "podman-compose" }

[git]
strip_sections = ["credential", "core.hooksPath"]
overrides      = { "push.default" = "nothing" }

[entrypoint]
cmd         = "claude"
args        = []
interactive = true

[verify.custom]
checks = [
  { name = "podman socket raggiungibile", cmd = "test -S /run/podman/podman.sock",                                                         severity = "critical" },
  { name = "podman API risponde",         cmd = "curl -sf --unix-socket /run/podman/podman.sock http://localhost/version", severity = "critical" },
]

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0
