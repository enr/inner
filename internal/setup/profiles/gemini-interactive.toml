schema_version = "1"
name = "gemini-interactive"
description = "Interactive Gemini CLI agent (network enabled)"

[sandbox]
network   = true
clipboard = false

[mounts]
# ~/.gemini is NOT mounted directly. inner intercepts this at runtime and
# replaces it with a sanitized temporary clone containing only:
#   settings.json      (user preferences — optional)
# Authentication uses the GEMINI_API_KEY environment variable (inherited via
# the env.inherit list below); no credentials file is needed.
# The clone is deleted when the sandbox exits; the real ~/.gemini is untouched.
"~/.gemini" = { dest = "~/.gemini", mode = "rw" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL", "GEMINI_API_KEY"]

[entrypoint]
cmd         = "gemini"
args        = []
interactive = true
# gemini (Node.js/libuv) probes terminal capabilities during module init,
# before it calls setRawMode itself — tui = true makes the launcher put
# the host terminal in raw mode before the child starts.
tui         = true

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
