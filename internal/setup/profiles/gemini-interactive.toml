schema_version = "1"
name         = "gemini-interactive"
description  = "Interactive Gemini CLI agent (network enabled)"
capabilities = ["gemini"]

[sandbox]
network   = true
clipboard = false

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL", "GEMINI_API_KEY"]

[entrypoint]
cmd         = "gemini"
args        = []
interactive = true
# gemini (Node.js/libuv) probes terminal capabilities during module init,
# before it calls setRawMode itself — tui = true makes the launcher put
# the host terminal in raw mode before the child starts.
tui         = true

[output]
summary         = false
log             = "~/.config/inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
