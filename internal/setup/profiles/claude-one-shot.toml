schema_version = "1"
name         = "claude-one-shot"
description  = "Non-interactive Claude Code agent (dangerously-skip-permissions)"
capabilities = ["claude"]

[sandbox]
network   = true
clipboard = false

[mounts]
# Hide host runtime sockets (dbus, systemd, pipewire, …) from the sandbox.
# Claude's Node.js runtime would otherwise find and connect to them via the
# root ro-bind, which can cause blocking calls that hang startup.
"/run/user/$UID" = { dest = "/run/user/$UID", mode = "tmpfs" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "claude"
args        = ["--dangerously-skip-permissions"]
interactive = false

[output]
summary         = true
log             = "~/.inner/logs/"
timeout_seconds = 1800  # 30 minutes

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
