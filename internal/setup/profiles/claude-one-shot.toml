schema_version = "1"
name = "claude-one-shot"
description = "Non-interactive Claude Code agent (dangerously-skip-permissions)"

[sandbox]
network   = true
clipboard = false

[mounts]
# ~/.claude is NOT mounted directly. inner intercepts this at runtime and
# replaces it with a sanitized temporary clone containing only:
#   .credentials.json  (auth token — required)
#   settings.json      (user preferences — optional)
#   skills/            (user skill definitions — optional)
# All other subdirs (sessions/, history/, projects/, …) start fresh and empty.
# The clone is deleted when the sandbox exits; the real ~/.claude is untouched.
"~/.claude" = { dest = "~/.claude", mode = "rw" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "claude"
args        = ["--dangerously-skip-permissions"]
interactive = false

[output]
summary         = true
log             = "~/.inner/logs/"
timeout_seconds = 1800  # 30 minutes

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
