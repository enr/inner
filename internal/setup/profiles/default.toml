schema_version = "1"
name = "default"
description = "Interactive shell in sandbox (no network)"

[sandbox]
network   = false
clipboard = false

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = ""   # empty = $SHELL
args        = []
interactive = true

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
