schema_version = "1"
name          = "claude-interactive"
description   = "Interactive Claude Code agent (network enabled)"
capabilities  = ["claude"]

[sandbox]
network   = true
clipboard = false

[mounts]
# Hide host runtime sockets (dbus, systemd, pipewire, …) from the sandbox.
# Claude's Node.js runtime would otherwise find and connect to them via the
# root ro-bind, which can cause blocking calls that hang startup.
"/run/user/$UID" = { dest = "/run/user/$UID", mode = "tmpfs" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "claude"
args        = []
interactive = true
# claude (Node.js/libuv) probes terminal capabilities during module init,
# before it calls setRawMode itself — tui = true makes the launcher put
# the host terminal in raw mode before the child starts.
tui         = true

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
