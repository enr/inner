schema_version = "1"
name          = "cursor-interactive"
description   = "Interactive Cursor Agent (network enabled)"
capabilities  = ["cursor"]

[sandbox]
network   = true
clipboard = false

[mounts]
# Hide host runtime sockets (dbus, systemd, pipewire, …) from the sandbox.
# cursor-agent (Node.js/libuv) would otherwise probe them at startup.
# The system keychain (libsecret) uses a dbus socket; cursor-agent falls back
# to the file-based auth.json when the keychain is unreachable.
"/run/user/$UID" = { dest = "/run/user/$UID", mode = "tmpfs" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]
# XDG_CONFIG_HOME is intentionally NOT inherited so cursor-agent always resolves
# auth.json relative to HOME (→ ~/.config/cursor/auth.json), matching the mount.

[entrypoint]
cmd         = "cursor-agent"
args        = []
interactive = true
# cursor-agent (Node.js/libuv) probes terminal capabilities during module init,
# before it calls setRawMode itself — tui = true makes the launcher put
# the host terminal in raw mode before the child starts.
tui         = true

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
