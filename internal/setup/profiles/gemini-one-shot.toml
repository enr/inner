schema_version = "1"
name         = "gemini-one-shot"
description  = "Non-interactive Gemini CLI agent (--yolo)"
capabilities = ["gemini"]

[sandbox]
network   = true
clipboard = false

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL", "GEMINI_API_KEY"]

[entrypoint]
cmd         = "gemini"
args        = ["--yolo"]
interactive = false

[output]
summary         = true
log             = "~/.inner/logs/"
timeout_seconds = 1800  # 30 minutes

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
