schema_version = "1"
name = "shell-oneshot"
description = "Run a single shell command in sandbox (no network)"

[sandbox]
network   = false
clipboard = false

# ── Home isolation (allowlist model) ──────────────────────────────────────────
# This profile deliberately stays on the default "host-ro" model: it is a shell
# for the user's own hands, and an empty home would hide the dotfiles, tools and
# project files that make it useful. The sandbox still protects writes and the
# hard-coded credential list, but every other file under $HOME stays readable.
#
# For an agent-style shell (nothing readable except what is named), uncomment:
# home = "isolated"
# home_allow = ["~/.local/bin", "~/.nvm", "~/.asdf"]

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "/bin/bash"
args        = ["-c"]
interactive = false

[output]
summary         = false
log             = "~/.config/inner/logs/"
timeout_seconds = 60

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
