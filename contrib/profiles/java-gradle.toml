schema_version = "1"
name           = "java-gradle"
description    = "Interactive shell with Java Gradle and Podman support"
extends        = "shell-containers"

# The Gradle home is mounted rw, but ~/.gradle/gradle.properties stays hidden
# (it commonly carries signing keys and repository tokens). Opt in with:
#
#   [sandbox]
#   allow = ["gradle-properties"]
[mounts]
# git_scan = false: an artifact and build cache, too large to search for git
# repositories and holding none the user runs git in.
"~/.gradle" = { dest = "~/.gradle", mode = "rw", git_scan = false }

[env]
inherit = ["JAVA_HOME"]

[entrypoint]
history = [
  "./gradlew build",
  "./gradlew test",
  "./gradlew clean build",
]
