schema_version = "1"
name        = "opencode"
description = "Interactive OpenCode agent (network enabled)"

# The "opencode" capability sandboxes ~/.config/opencode and
# ~/.local/share/opencode at runtime: it copies the user config and auth token
# into throwaway temp dirs and leaves sessions, logs and storage fresh, so the
# sandboxed agent cannot read or corrupt previous runs.
capabilities = ["opencode"]

[sandbox]
network   = true
clipboard = false

[mounts]
# Hide host runtime sockets (dbus, systemd, pipewire, …) from the sandbox.
# OpenCode's Node.js runtime would otherwise find and connect to them,
# which can cause blocking calls that hang startup.
"/run/user/$UID" = { dest = "/run/user/$UID", mode = "tmpfs" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[entrypoint]
cmd         = "opencode"
args        = []
interactive = true
# opencode (Node.js/libuv) probes terminal capabilities during module init,
# before it calls setRawMode itself — tui = true makes the launcher put
# the host terminal in raw mode before the child starts.
tui         = true

[output]
summary         = false
log             = "~/.config/inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]

[git]
strip_sections = ["credential", "core.hooksPath"]
overrides      = { "push.default" = "nothing" }
