schema_version = "1"
name        = "rust"
description = "Interactive bash shell for Rust projects (cargo registry and rustup toolchain mounted)"

[sandbox]
network = true

[mounts]
"~/.cargo"  = { dest = "~/.cargo",  mode = "rw" }
"~/.rustup" = { dest = "~/.rustup", mode = "ro" }

[env]
clearenv = true
inherit  = ["HOME", "USER", "TERM", "LANG", "PATH", "SHELL"]

[env.set]
RUST_BACKTRACE = "1"

[entrypoint]
cmd         = "/bin/bash"
args        = []
interactive = true
history     = [
  "cargo build",
  "cargo test",
  "cargo clippy -- -D warnings",
  "cargo fmt --check",
  "cargo check",
  "cargo clean",
]

[output]
summary         = false
log             = "~/.inner/logs/"
timeout_seconds = 0

[noop]
block = ["apt-get", "apt", "yum", "dnf", "brew", "pacman", "yay"]
