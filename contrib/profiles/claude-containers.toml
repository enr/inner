schema_version = "1"
name        = "claude-containers"
description = "Agent con supporto container via podman rootless"
extends     = "claude-interactive"

[sandbox]
allow = ["nested-user-ns", "podman-socket"]

# ${UID} is expanded at load time to the numeric UID of the current user.
# Requires `podman system service` running on the host before `inner run`.
# Note: /run/user/${UID} tmpfs is inherited from claude-interactive and keeps
# host sockets hidden; the podman socket is bind-mounted on top of it.
[mounts]
"/run/user/${UID}/podman/podman.sock" = { dest = "/run/user/${UID}/podman/podman.sock", mode = "rw" }
"~/.local/share/containers"           = { dest = "~/.local/share/containers",           mode = "rw" }
"~/.config/containers"                = { dest = "~/.config/containers",                mode = "rw" }

[env]
# ANTHROPIC_API_KEY is merged with the inherit list from claude-interactive.
inherit = ["ANTHROPIC_API_KEY"]
set     = { "DOCKER_HOST" = "unix:///run/user/${UID}/podman/podman.sock" }

[noop]
rewrite = { "docker" = "podman", "docker-compose" = "podman-compose" }

[git]
strip_sections = ["credential", "core.hooksPath"]
overrides      = { "push.default" = "nothing" }

[verify.custom]
checks = [
  { name = "podman socket raggiungibile", cmd = "test -S /run/user/${UID}/podman/podman.sock",                                                                   severity = "critical" },
  { name = "podman API risponde",         cmd = "curl -sf --unix-socket /run/user/${UID}/podman/podman.sock http://localhost/version", severity = "critical" },
]
